<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг ESP32-S3</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
        h1 { color: #4fc3f7; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .val { font-size: 1.4em; font-weight: bold; color: #81c784; }
        .val.alarm { color: #e57373; }
        .val.wet { color: #4fc3f7; }
        .lbl { color: #aaa; font-size: 0.9em; }
        input[type="number"], input[type="text"] { background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 5px; width: 80px; }
        button { background: #4fc3f7; color: #000; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #29b6f6; }
        ul { list-style: none; padding: 0; margin-top: 10px; }
        li { background: #333; margin: 5px 0; padding: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { background: #e57373; padding: 4px 8px; font-size: 12px; margin: 0; }
        .sms-btn { background: #ffb74d; width: 100%; margin-top: 10px; }
        .status-container { text-align: center; margin-bottom: 20px; background: #1e1e1e; padding: 10px; border-radius: 10px; max-width: 300px; margin-left: auto; margin-right: auto; }
        .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #e57373; margin-right: 8px; vertical-align: middle; transition: 0.3s; }
        .status-dot.connected { background: #81c784; }
        .status-text { vertical-align: middle; font-weight: bold; }
        #smsSection { display: none; }
    </style>
</head>
<body>
    <h1>Мониторинг ESP32-S3</h1>
    
    <div class="status-container">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Подключение к MQTT...</span>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Датчики</h2>
            <p><span class="lbl">DS18B20 (1):</span> <span class="val" id="ds1">--</span> °C</p>
            <p><span class="lbl">DS18B20 (2):</span> <span class="val" id="ds2">--</span> °C</p>
            <p><span class="lbl">DS18B20 (3):</span> <span class="val" id="ds3">--</span> °C</p>
            <p><span class="lbl">DHT11:</span> <span class="val" id="dht_t">--</span> °C / <span class="val" id="dht_h">--</span> %</p>
            <p><span class="lbl">Влага:</span> <span class="val" id="rain">--</span></p>
        </div>

        <div class="card">
            <h2>Питание и Сеть</h2>
            <p><span class="lbl">Источник:</span> <span class="val" id="power">--</span></p>
            <p><span class="lbl">Батарея:</span> <span class="val" id="batt">--</span> В (<span id="batt_pct">--</span>%)</p>
            <p><span class="lbl">4G IP:</span> <span class="val" id="gsm_ip">--</span></p>
            <p><span class="lbl">Сигнал:</span> <span class="val" id="gsm_signal">--</span></p>
        </div>

        <div class="card">
            <h2>Время</h2>
            <p><span class="lbl">Uptime:</span> <span class="val" id="uptime">--</span></p>
            <p><span class="lbl">Обновлено:</span> <span class="val" id="time">--</span></p>
            <button onclick="showSmsSettings()">📱 Настройки SMS</button>
        </div>

        <!-- Блок SMS (скрыт по умолчанию) -->
        <div class="card" id="smsSection">
            <h2>SMS Оповещения</h2>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <input type="text" id="phone_input" placeholder="+7..." style="width: 100%;">
                <button onclick="addPhone()">+</button>
            </div>
            <ul id="phone_list"></ul>
            <button class="sms-btn" onclick="testSms()">📩 Отправить тест SMS</button>
        </div>
    </div>

    <script>
        const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
        const MQTT_PREFIX = "MonitorESP32-002";
        const TOPIC_STATUS = MQTT_PREFIX + "/status";
        const TOPIC_CMD = MQTT_PREFIX + "/cmd";
        const TOPIC_PHONES = MQTT_PREFIX + "/phones";

        let client;
        let PIN = "";

        function showSmsSettings() {
            PIN = prompt("Введите PIN-код (1111):");
            if (PIN === "1111") {
                document.getElementById('smsSection').style.display = 'block';
                client.publish(TOPIC_CMD, 'get_phones');
            } else if (PIN !== null) {
                alert("Неверный PIN-код!");
            }
        }

        function updateUI(data) {
            document.getElementById('ds1').textContent = data.ds !== undefined ? data.ds.toFixed(2) : '--';
            document.getElementById('ds2').textContent = data.ds2 !== undefined ? data.ds2.toFixed(2) : '--';
            document.getElementById('ds3').textContent = data.ds3 !== undefined ? data.ds3.toFixed(2) : '--';
            document.getElementById('dht_t').textContent = data.dht_t !== undefined ? data.dht_t.toFixed(1) : '--';
            document.getElementById('dht_h').textContent = data.dht_h !== undefined ? data.dht_h.toFixed(0) : '--';
            
            const rainEl = document.getElementById('rain');
            if (data.rain === 1) { rainEl.textContent = 'Влажно'; rainEl.className = 'val wet'; } 
            else { rainEl.textContent = 'Сухо'; rainEl.className = 'val'; }

            document.getElementById('power').textContent = data.extPower ? 'Внешнее' : 'Батарея';
            document.getElementById('batt').textContent = data.batt !== undefined ? data.batt.toFixed(2) : '--';
            document.getElementById('batt_pct').textContent = data.batt_pct !== undefined ? data.batt_pct.toFixed(0) : '--';
            document.getElementById('gsm_ip').textContent = data.modem_ip || '--';
            document.getElementById('gsm_signal').textContent = data.gsm !== undefined ? data.gsm : '--';
            
            document.getElementById('uptime').textContent = data.uptime || '--';
            document.getElementById('time').textContent = data.time || '--';
        }

        function updatePhoneList(payload) {
            const listEl = document.getElementById('phone_list');
            listEl.innerHTML = '';
            try {
                const data = JSON.parse(payload);
                const phones = data.phones || [];
                if (phones.length === 0) {
                    listEl.innerHTML = '<li style="color: #888; font-size: 14px;">Нет номеров</li>';
                    return;
                }
                phones.forEach((phone, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${phone}</span> <button class="del-btn" onclick="deletePhone(${index})">X</button>`;
                    listEl.appendChild(li);
                });
            } catch (e) {}
        }

        function connectMQTT() {
            client = mqtt.connect(MQTT_BROKER, {
                clientId: 'github_web_' + Math.random().toString(16).slice(2, 8),
                clean: true,
                connectTimeout: 10000,
                reconnectPeriod: 5000,
            });

            client.on('connect', () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Подключено';
                client.subscribe(TOPIC_STATUS, { qos: 0 });
                client.subscribe(TOPIC_PHONES, { qos: 0 });
            });

            client.on('reconnect', () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Переподключение...';
            });

            client.on('close', () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Связь потеряна';
            });

            client.on('message', (topic, payload) => {
                if (topic === TOPIC_STATUS) {
                    try { updateUI(JSON.parse(payload.toString())); } catch (e) {}
                } else if (topic === TOPIC_PHONES) {
                    updatePhoneList(payload.toString());
                }
            });
        }

        function addPhone() {
            if (PIN !== "1111") return;
            const phone = document.getElementById('phone_input').value.trim();
            if (!phone) return;
            client.publish(TOPIC_CMD, `add_phone:${phone}`);
            document.getElementById('phone_input').value = '';
        }

        function deletePhone(index) {
            if (PIN !== "1111") return;
            client.publish(TOPIC_CMD, `del_phone:${index}`);
        }

        function testSms() {
            if (PIN !== "1111") return;
            client.publish(TOPIC_CMD, 'test_sms');
            alert('Команда на отправку теста отправлена!');
        }

        connectMQTT();
    </script>
</body>
</html>
