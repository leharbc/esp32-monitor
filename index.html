<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ESP32 Monitor</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background:#111; color:#eee; margin:0; padding:12px; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial; }
    h1 { color:#4fc3f7; font-size:22px; text-align:center; margin:8px 0 4px; }
    .sub { color:#888; font-size:13px; text-align:center; margin-bottom:16px; }
    .status { display:flex; align-items:center; justify-content:center; gap:8px; background:#1e1e1e; padding:10px; border-radius:10px; margin-bottom:14px; font-size:14px; }
    .dot { width:12px; height:12px; border-radius:6px; background:#e57373; transition:background .3s; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
    .card { background:#1e1e1e; border-radius:12px; padding:14px; text-align:center; }
    .val { font-size:1.7em; font-weight:700; color:#4fc3f7; }
    .lbl { color:#aaa; font-size:.8em; margin-top:6px; }
    .val.red { color:#e57373; }
    .val.green { color:#81c784; }
  </style>
</head>
<body>
<h1 id="title">ESP32 Monitor</h1>
<div class="sub">Мониторинг через 4G (GitHub)</div>

<div class="status">
  <div class="dot" id="dot"></div>
  <span id="statusTxt">Подключение к брокеру...</span>
</div>

<div class="grid">
  <div class="card"><div class="val" id="ds">--</div><div class="lbl">DS18B20, °C</div></div>
  <div class="card"><div class="val" id="dht">--</div><div class="lbl">DHT11, °C</div></div>
  <div class="card"><div class="val" id="hum">--</div><div class="lbl">Влажность, %</div></div>
  <div class="card"><div class="val" id="water">--</div><div class="lbl">Влага/Дождь</div></div>
  <div class="card"><div class="val" id="gsm">--</div><div class="lbl">Сигнал 4G</div></div>
</div>

<div style="text-align:center; color:#888; font-size:12px; margin-top:20px;">
  Камера доступна только при локальном подключении по IP.
</div>

<script>
  const PREFIX = "MonitorESP32-002";
  const BROKER = "wss://broker.hivemq.com:8884/mqtt";

  const dot = document.getElementById('dot');
  const statusTxt = document.getElementById('statusTxt');

  const client = mqtt.connect(BROKER, {
    clientId: 'web-' + Math.random().toString(16).slice(2, 10),
    clean: true, connectTimeout: 10000, reconnectPeriod: 5000, keepalive: 30,
  });

  client.on('connect', () => {
    dot.style.background = '#81c784';
    statusTxt.textContent = 'Подключено';
    client.subscribe(PREFIX + '/status', { qos: 0 });
  });

  client.on('close', () => {
    dot.style.background = '#e57373';
    statusTxt.textContent = 'Связь потеряна';
  });

  client.on('message', (topic, payload) => {
    if (topic === PREFIX + '/status') {
      try {
        const j = JSON.parse(payload.toString());
        
        document.getElementById('ds').textContent = j.ds.toFixed(2);
        document.getElementById('dht').textContent = j.dht_t.toFixed(1);
        document.getElementById('hum').textContent = j.dht_h.toFixed(0);
        
        const wEl = document.getElementById('water');
        wEl.textContent = j.rain ? 'Влажно' : 'Сухо';
        wEl.className = 'val ' + (j.rain ? 'red' : 'green');

        const gEl = document.getElementById('gsm');
        gEl.textContent = j.gsm + '/31';
        gEl.className = 'val ' + (j.gsm > 15 ? 'green' : j.gsm > 8 ? 'yellow' : 'red');
      } catch(e) {
        console.error("JSON Parse error", e);
      }
    }
  });
</script>
</body>
</html>
